<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background card with shadow -->
  <rect x="8" y="6" width="48" height="52" rx="4" fill="#faf9f6" filter="url(#shadow)"/>
  
  <!-- Navy header bar -->
  <rect x="8" y="6" width="48" height="16" rx="4" fill="#1a1a2e"/>
  <rect x="8" y="14" width="48" height="8" fill="#1a1a2e"/>
  
  <!-- Coral bookmark ribbon -->
  <path d="M 46 6 L 46 26 L 50 22 L 54 26 L 54 6 Z" fill="#e07a5f"/>
  
  <!-- Checkboxes as content lines -->
  <rect x="16" y="28" width="8" height="8" rx="2" fill="none" stroke="#5a8a6e" stroke-width="2"/>
  <rect x="28" y="30" width="20" height="4" rx="2" fill="#e8e6e1"/>
  
  <rect x="16" y="40" width="8" height="8" rx="2" fill="#5a8a6e"/>
  <path d="M 18 44 L 20 46 L 22 42" fill="none" stroke="#faf9f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="28" y="42" width="20" height="4" rx="2" fill="#e8e6e1"/>
  
  <!-- Coral accent corner -->
  <circle cx="52" cy="50" r="3" fill="#e07a5f" opacity="0.8"/>
</svg>