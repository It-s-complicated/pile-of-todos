<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="A pile of three todo sheets, with one task checked off">
  <rect width="512" height="512" fill="#0c0e10"/>
  <defs>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offset"/>
      <feFlood flood-color="#050607" flood-opacity="0.55"/>
      <feComposite in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#lift)">
    <g transform="rotate(-16 246 263)">
      <rect x="147" y="141" width="198" height="244" rx="15" fill="#dbe9ff"/>
