<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Colorful stack of checklist sticky notes">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="6" dy="10" result="offsetBlur"/>
      <feFlood flood-color="#111827" flood-opacity="0.32" result="flood"/>
      <feComposite in="flood" in2="offsetBlur" operator="in" result="shadowColor"/>
      <feMerge>
        <feMergeNode in="shadowColor"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="note-lines" stroke="#1f2937" stroke-opacity="0.58" fill="none" stroke-width="3">
      <rect x="20" y="22" width="14" height="14" />
      <line x1="44" y1="29" x2="168" y2="29" />
      <rect x="20" y="52" width="14" height="14" />
      <line x1="44" y1="59" x2="168" y2="59" />
      <rect x="20" y="82" width="14" height="14" />
      <line x1="44" y1="89" x2="168" y2="89" />
      <rect x="20" y="112" width="14" height="14" />
      <line x1="44" y1="119" x2="168" y2="119" />
      <rect x="20" y="142" width="14" height="14" />
      <line x1="44" y1="149" x2="168" y2="149" />
      <rect x="20" y="172" width="14" height="14" />
      <line x1="44" y1="179" x2="168" y2="179" />
    </g>
  </defs>

  <g filter="url(#shadow)">
    <g transform="translate(84 128) rotate(-30 96 112)">
      <rect width="192" height="224" rx="10" fill="#22d3ee"/>
      <use href="#note-lines"/>
    </g>

    <g transform="translate(124 112) rotate(-12 96 112)">
      <rect width="192" height="224" rx="10" fill="#f725a8"/>
      <use href="#note-lines"/>
    </g>

    <g transform="translate(170 96) rotate(10 96 112)">
      <rect width="192" height="224" rx="10" fill="#a855f7"/>
      <use href="#note-lines"/>
    </g>

    <g transform="translate(78 214) rotate(-18 96 112)">
      <rect width="192" height="224" rx="10" fill="#3dd6eb"/>
      <use href="#note-lines"/>
    </g>

    <g transform="translate(240 220) rotate(18 96 112)">
      <rect width="192" height="224" rx="10" fill="#f725a8"/>
      <use href="#note-lines"/>
    </g>

    <g transform="translate(158 148) rotate(-5 96 112)">
      <rect width="192" height="224" rx="10" fill="#e8f400"/>
      <use href="#note-lines"/>
    </g>
  </g>
</svg>
