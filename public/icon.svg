    </g>
    <g transform="rotate(12 269 254)">
      <rect x="170" y="132" width="198" height="244" rx="15" fill="#e2bec1"/>
      <path d="M288 174h57M300 193h45" stroke="#533a3c" stroke-width="7" stroke-linecap="round" opacity=".6"/>
    </g>
    <g transform="rotate(-4 264 275)">
      <rect x="159" y="154" width="210" height="242" rx="17" fill="#e2e6eb"/>
      <path d="M198 185h132" stroke="#33443c" stroke-width="8" stroke-linecap="round" opacity=".3"/>
      <circle cx="203" cy="238" r="20" fill="#45564e"/>
      <path d="m193 238 7 7 14-16" fill="none" stroke="#d4e8dd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M241 238h89" stroke="#33443c" stroke-width="9" stroke-linecap="round" opacity=".8"/>
      <circle cx="203" cy="299" r="17" fill="none" stroke="#45564e" stroke-width="6"/>
      <path d="M241 299h89" stroke="#33443c" stroke-width="9" stroke-linecap="round" opacity=".8"/>
      <circle cx="203" cy="355" r="17" fill="none" stroke="#45564e" stroke-width="6"/>
      <path d="M241 355h65" stroke="#33443c" stroke-width="9" stroke-linecap="round" opacity=".8"/>
    </g>
  </g>
</svg>
