allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  sharp: false

overrides:
  # Keep the Supabase adapter and Vue bindings on the same DB instance/version.
  # Match the exact @tanstack/db dependency declared by @tanstack/vue-db.
  '@tanstack/db': '0.12.0'
  # Third-party ranges exclude prereleases; keep only their Vue RC entry points.
  'vue': 'rc'
  '@vue/compiler-dom': 'rc'
  '@vue/compiler-sfc': 'rc'
  '@vue/shared': 'rc'
  # Keep every Vite consumer on the core bundled with Vite+.
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - 'vue'
    - vite
  allowedVersions:
    vite: '*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0'
  - vite-plus@1.0.0
